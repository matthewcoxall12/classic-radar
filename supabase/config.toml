project_id = "classic-radar"

# GitHub Actions presents a third-party OIDC JWT. The Supabase gateway cannot
# validate that issuer, so the function performs strict issuer, audience,
# repository, owner, main-ref and exact-workflow checks itself.
[functions.ingest-events]
verify_jwt = false

# The welcome endpoint accepts only a valid signed-in Supabase user token.
[functions.send-welcome-email]
verify_jwt = true
